<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
         :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1f1f1f;
            --text-primary: #e0e0e0;
            --text-secondary: #888;
            --accent: #00ff88;
            --accent-dim: #00ff8820;
            --border: #2a2a2a;
        }
        
        [data-theme="light"] {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #ececec;
            --text-primary: #1a1a1a;
            --text-secondary: #666;
            --accent: #00aa55;
            --accent-dim: #00aa5520;
            --border: #d0d0d0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 0.05em;
        }
        
        .status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.4;
            }
        }
        
        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 4px;
        }
        
        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-primary);
        }
        
        .metric-change {
            font-size: 13px;
            margin-top: 4px;
        }
        
        .positive {
            color: var(--accent);
        }
        
        .negative {
            color: #ff4444;
        }
        
        .chart-section {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 25px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }
        
        .data-table {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .table-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .table-content {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .table-row {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            display: grid;
            grid-template-columns: 140px 1fr 100px 100px;
            gap: 15px;
            font-size: 13px;
        }
        
        .table-row:hover {
            background: var(--accent-dim);
        }
        
        .timestamp {
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        canvas {
            max-height: 300px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><span class="status"></span>QUANTUM ENGINE</h1>
            <button class="theme-toggle" onclick="toggleTheme()">TOGGLE THEME</button>
        </header>

        <div class="metrics-grid">
            <div class="metric-card">
                <div class="metric-label">Balance</div>
                <div class="metric-value" id="balance">$0.00</div>
                <div class="metric-change" id="balanceChange">--</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Profit</div>
                <div class="metric-value" id="profit">$0.00</div>
                <div class="metric-change" id="profitPercent">0.00%</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Win Rate</div>
                <div class="metric-value" id="winRate">0%</div>
                <div class="metric-change" id="trades">0 trades</div>
            </div>

            <div class="metric-card">
                <div class="metric-label">Opportunities</div>
                <div class="metric-value" id="opportunities">0</div>
                <div class="metric-change" id="scans">0 scans</div>
            </div>
        </div>

        <div class="chart-section">
            <div class="section-title">Balance History</div>
            <canvas id="balanceChart"></canvas>
        </div>

        <div class="data-table">
            <div class="table-header">
                <div class="section-title">Recent Activity</div>
            </div>
            <div class="table-content" id="activityLog"></div>
        </div>
    </div>

    <script>
        let chart = null;
        let currentTheme = 'dark';

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            if (chart) updateChart();
        }

        function updateDashboard() {
            fetch('/api/data')
                .then(r => r.json())
                .then(data => {
                    // Update metrics
                    const growth = data.growth || {};
                    const metrics = data.performance_metrics || {};
                    const stats = data.system_stats || {};

                    document.getElementById('balance').textContent = '$' + (growth.current_usd || 0).toFixed(2);
                    document.getElementById('balanceChange').textContent = (growth.start_usd || 0).toFixed(2) + ' ETH start';

                    const profit = growth.profit_usd || 0;
                    const profitPercent = growth.total_percent || 0;
                    document.getElementById('profit').textContent = (profit >= 0 ? '+' : '') + '$' + profit.toFixed(2);
                    document.getElementById('profit').className = 'metric-value ' + (profit >= 0 ? 'positive' : 'negative');
                    document.getElementById('profitPercent').textContent = (profitPercent >= 0 ? '+' : '') + profitPercent.toFixed(2) + '%';
                    document.getElementById('profitPercent').className = 'metric-change ' + (profitPercent >= 0 ? 'positive' : 'negative');

                    const winRate = (metrics.win_rate || 0) * 100;
                    document.getElementById('winRate').textContent = winRate.toFixed(0) + '%';
                    document.getElementById('trades').textContent = (metrics.total_trades || 0) + ' trades';

                    document.getElementById('opportunities').textContent = stats.opportunities_found || 0;
                    document.getElementById('scans').textContent = (stats.scans_completed || 0) + ' scans';

                    // Update chart
                    if (data.balance_history && data.balance_history.length > 0) {
                        const labels = data.balance_history.map(b =>
                            new Date(b.timestamp).toLocaleTimeString([], {
                                hour: '2-digit',
                                minute: '2-digit'
                            })
                        );
                        const balances = data.balance_history.map(b => b.usd);

                        const chartColor = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();

                        if (chart) {
                            chart.data.labels = labels;
                            chart.data.datasets[0].data = balances;
                            chart.data.datasets[0].borderColor = chartColor;
                            chart.update();
                        } else {
                            createChart(labels, balances, chartColor);
                        }
                    }

                    // Update activity log
                    updateActivity(data.trade_history || [], data.opportunity_log || []);
                })
                .catch(e => console.error('Update error:', e));
        }

        function createChart(labels, balances, color) {
            const ctx = document.getElementById('balanceChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        data: balances,
                        borderColor: color,
                        backgroundColor: 'transparent',
                        tension: 0.3,
                        borderWidth: 1.5,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            grid: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--border')
                            },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary'),
                                callback: v => '$' + v.toFixed(2)
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-secondary')
                            }
                        }
                    }
                }
            });
        }

        function updateActivity(trades, opps) {
            const combined = [
                ...trades.map(t => ({...t,
                    type: 'trade'
                })),
                ...opps.map(o => ({...o,
                    type: 'opportunity'
                }))
            ].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 20);

            const html = combined.map(item => {
                if (item.type === 'trade') {
                    return `<div class="table-row">
                        <div class="timestamp">${new Date(item.timestamp).toLocaleTimeString()}</div>
                        <div>TRADE: ${item.pair} (${item.buy_dex} → ${item.sell_dex})</div>
                        <div class="${item.success ? 'positive' : 'negative'}">${item.success ? 'SUCCESS' : 'FAILED'}</div>
                        <div>$${(item.estimated_profit_usd || 0).toFixed(2)}</div>
                    </div>`;
                } else {
                    return `<div class="table-row">
                        <div class="timestamp">${new Date(item.timestamp).toLocaleTimeString()}</div>
                        <div>OPP: ${item.pair} (${item.spread_percent}% spread)</div>
                        <div>${(item.confidence * 100).toFixed(0)}% conf</div>
                        <div>$${(item.profit_usd || 0).toFixed(2)}</div>
                    </div>`;
                }
            }).join('');

            document.getElementById('activityLog').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-secondary)">No activity yet</div>';
        }

        updateDashboard();
        setInterval(updateDashboard, 2000);
    </script>
</body>

</html>
